name: Deploy observatory to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - telemetry.html
      - api/**
      - docs/**
      - README.md
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public assets only
        run: |
          mkdir _site
          cp index.html telemetry.html _site/
          cp -r api docs _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
